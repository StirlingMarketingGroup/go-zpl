name: Release libzpl

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (leave empty for latest)'
        required: false

permissions:
  contents: write

jobs:
  build-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Linux amd64
        run: |
          cd cmd/libzpl
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -buildmode=c-shared -o libzpl-linux-amd64.so ./

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libzpl-linux-amd64
          path: |
            cmd/libzpl/libzpl-linux-amd64.so
            cmd/libzpl/libzpl-linux-amd64.h

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Linux arm64
        run: |
          cd cmd/libzpl
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 \
            go build -buildmode=c-shared -o libzpl-linux-arm64.so ./

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libzpl-linux-arm64
          path: |
            cmd/libzpl/libzpl-linux-arm64.so
            cmd/libzpl/libzpl-linux-arm64.h

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build macOS arm64
        run: |
          cd cmd/libzpl
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
            go build -buildmode=c-shared -o libzpl-darwin-arm64.dylib ./

      - name: Build macOS amd64
        run: |
          cd cmd/libzpl
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 \
            go build -buildmode=c-shared -o libzpl-darwin-amd64.dylib ./

      - name: Create universal binary
        run: |
          cd cmd/libzpl
          lipo -create -output libzpl-darwin-universal.dylib \
            libzpl-darwin-arm64.dylib \
            libzpl-darwin-amd64.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libzpl-darwin
          path: |
            cmd/libzpl/libzpl-darwin-arm64.dylib
            cmd/libzpl/libzpl-darwin-amd64.dylib
            cmd/libzpl/libzpl-darwin-universal.dylib
            cmd/libzpl/libzpl-darwin-arm64.h

  build-windows-amd64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Windows amd64
        shell: bash
        run: |
          cd cmd/libzpl
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 \
            go build -buildmode=c-shared -o libzpl-windows-amd64.dll ./

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libzpl-windows-amd64
          path: |
            cmd/libzpl/libzpl-windows-amd64.dll
            cmd/libzpl/libzpl-windows-amd64.h

  build-windows-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install llvm-mingw for Windows ARM64 cross-compilation
        run: |
          wget -q https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          tar -xf llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          echo "$PWD/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64/bin" >> $GITHUB_PATH

      - name: Build Windows arm64
        run: |
          cd cmd/libzpl
          CGO_ENABLED=1 GOOS=windows GOARCH=arm64 CC=aarch64-w64-mingw32-gcc \
            go build -buildmode=c-shared -o libzpl-windows-arm64.dll ./

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libzpl-windows-arm64
          path: |
            cmd/libzpl/libzpl-windows-arm64.dll
            cmd/libzpl/libzpl-windows-arm64.h

  upload-release:
    needs: [build-linux-amd64, build-linux-arm64, build-macos, build-windows-amd64, build-windows-arm64]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release archives
        run: |
          mkdir -p release

          # Linux amd64
          cd artifacts/libzpl-linux-amd64
          tar -czvf ../../release/libzpl-linux-amd64.tar.gz *
          cd ../..

          # Linux arm64
          cd artifacts/libzpl-linux-arm64
          tar -czvf ../../release/libzpl-linux-arm64.tar.gz *
          cd ../..

          # macOS (include all variants)
          cd artifacts/libzpl-darwin
          tar -czvf ../../release/libzpl-darwin.tar.gz *
          cd ../..

          # Windows amd64
          cd artifacts/libzpl-windows-amd64
          zip -r ../../release/libzpl-windows-amd64.zip *
          cd ../..

          # Windows arm64
          cd artifacts/libzpl-windows-arm64
          zip -r ../../release/libzpl-windows-arm64.zip *
          cd ../..

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/libzpl-linux-amd64.tar.gz
            release/libzpl-linux-arm64.tar.gz
            release/libzpl-darwin.tar.gz
            release/libzpl-windows-amd64.zip
            release/libzpl-windows-arm64.zip

  publish-crate:
    name: Publish zpl-rs
    needs: [upload-release]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
        working-directory: rust/zpl-rs
