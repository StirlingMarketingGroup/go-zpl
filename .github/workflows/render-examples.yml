name: Render Example Labels

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'testdata/**/*.zpl'
      - 'render/**'
      - 'parse.go'
      - 'barcode.go'
      - 'graphic.go'
      - '.github/workflows/render-examples.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # master only accepts pushes from PRs, the merge queue, or the smg-actions
      # app (ruleset bypass). The default GITHUB_TOKEN pushes as
      # github-actions[bot], which the ruleset rejects, so mint an app token.
      - id: smg-actions
        uses: getsentry/action-github-app-token@v3
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          token: ${{ steps.smg-actions.outputs.token }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Render example labels
        run: |
          cat > /tmp/render_examples.go << 'GOEOF'
          //go:build ignore

          package main

          import (
              "fmt"
              "os"
              "path/filepath"
              "strings"

              zpl "github.com/StirlingMarketingGroup/go-zpl"
              "github.com/StirlingMarketingGroup/go-zpl/render"
          )

          func main() {
              // Find all .zpl files in testdata
              err := filepath.Walk("testdata", func(path string, info os.FileInfo, err error) error {
                  if err != nil {
                      return err
                  }
                  if !info.IsDir() && strings.HasSuffix(path, ".zpl") {
                      renderZPL(path)
                  }
                  return nil
              })
              if err != nil {
                  fmt.Fprintf(os.Stderr, "Error walking testdata: %v\n", err)
                  os.Exit(1)
              }
          }

          func renderZPL(zplPath string) {
              data, err := os.ReadFile(zplPath)
              if err != nil {
                  fmt.Fprintf(os.Stderr, "Error reading %s: %v\n", zplPath, err)
                  return
              }

              label, err := zpl.Parse(string(data))
              if err != nil {
                  fmt.Fprintf(os.Stderr, "Error parsing %s: %v\n", zplPath, err)
                  return
              }

              // Create renderer with label dimensions
              width := label.Width()
              if width == 0 {
                  width = 812
              }
              renderer := render.New(zpl.DPI203).WithSize(width, 0).WithIgnoreLabelHome(true)

              // Output PNG path
              pngPath := strings.TrimSuffix(zplPath, ".zpl") + "_rendered.png"

              f, err := os.Create(pngPath)
              if err != nil {
                  fmt.Fprintf(os.Stderr, "Error creating %s: %v\n", pngPath, err)
                  return
              }

              if err := renderer.RenderPNG(label, f); err != nil {
                  f.Close()
                  fmt.Fprintf(os.Stderr, "Error rendering %s: %v\n", zplPath, err)
                  return
              }
              f.Close()

              fmt.Printf("Rendered %s -> %s\n", zplPath, pngPath)
          }
          GOEOF
          go run /tmp/render_examples.go

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code testdata/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit updated renders
        if: steps.git-check.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.smg-actions.outputs.token }}
        run: |
          git config --local user.name "smg-actions[bot]"
          git config --local user.email "smg-actions[bot]@users.noreply.github.com"
          git add testdata/**/*.png
          git commit -m "Auto-render example labels [skip ci]"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}
          git push origin HEAD:master
