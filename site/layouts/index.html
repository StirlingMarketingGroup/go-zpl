{{ define "main" }}
<div class="container">
    <header>
        <h1>ZPL Label Renderer</h1>
        <a href="https://github.com/StirlingMarketingGroup/go-zpl" target="_blank" rel="noopener" class="github-link">
            <svg height="24" viewBox="0 0 16 16" width="24" fill="currentColor">
                <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
            </svg>
        </a>
    </header>

    <div class="controls">
        <label>
            Example:
            <select id="example">
                <option value="">-- Select Example --</option>
                <option value="hello">Hello World</option>
                <option value="shipping">Shipping Label</option>
                <option value="ups">UPS Label</option>
                <option value="product">Product Label</option>
                <option value="qrcode">QR Code Card</option>
                <option value="shapes">Shapes Demo</option>
                <option value="barcodes">Barcode Sampler</option>
            </select>
        </label>
        <label>
            DPI:
            <select id="dpi">
                <option value="152">152</option>
                <option value="203" selected>203</option>
                <option value="300">300</option>
                <option value="600">600</option>
            </select>
        </label>
        <label>
            Units:
            <select id="unit">
                <option value="in" selected>inches</option>
                <option value="mm">mm</option>
                <option value="dots">dots</option>
            </select>
        </label>
        <label>
            <span id="width-label">Width (in):</span>
            <input type="number" id="width" value="4" min="0" step="0.1" placeholder="auto">
        </label>
        <label>
            <span id="height-label">Height (in):</span>
            <input type="number" id="height" value="6" min="0" step="0.1" placeholder="auto">
        </label>
        <label class="checkbox-label">
            <input type="checkbox" id="ignore-label-home" checked>
            Ignore label home (^LH)
        </label>
        <span id="render-time"></span>
    </div>

    <div class="main-content">
        <div class="editor-panel">
            <div id="editor"></div>
            <div class="drop-zone" id="drop-zone">
                <span>Drop ZPL file here or paste ZPL code</span>
            </div>
        </div>
        <div class="preview-panel">
            <div id="loading" class="loading">Loading WASM...</div>
            <div id="error" class="error"></div>
            <div id="preview-container">
                <img id="preview" alt="Rendered ZPL label">
            </div>
        </div>
    </div>

    <footer>
        &copy; {{ now.Year }} Stirling Marketing Group
    </footer>
</div>
{{ end }}
